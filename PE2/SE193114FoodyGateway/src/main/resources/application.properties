spring.application.name=SE193114FoodyGateway
server.port=8080
spring.cloud.gateway.server.webmvc.routes[0].id=restaurant-service
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/restaurants/**
spring.cloud.gateway.server.webmvc.routes[1].id=category-service
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/categories/**
spring.cloud.gateway.server.webmvc.routes[2].id=food-service
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/foods/**
